<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>신을 대신한 신 | THE GOD BEYOND GOD</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #08090d;
    color: #f4e9c8;
    font-family: 'Noto Serif KR', serif;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 15%,
        rgba(190,150,65,.17), transparent 50%),
        radial-gradient(ellipse at 20% 70%,
        rgba(100,80,35,.10), transparent 50%);
    pointer-events: none;
    z-index: -1;
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .5;
    background-image:
        radial-gradient(1px 1px at 10% 20%, #fff, transparent),
        radial-gradient(1px 1px at 30% 60%, #d8bd75, transparent),
        radial-gradient(2px 2px at 70% 30%, #fff, transparent),
        radial-gradient(1px 1px at 90% 80%, #d8bd75, transparent);
    background-size: 250px 250px;
    animation: stars 15s linear infinite;
}

@keyframes stars {
    from { transform: translateY(0); }
    to { transform: translateY(-100px); }
}

main {
    max-width: 900px;
    margin: auto;
    padding: 35px 20px 240px;
}

.hero {
    text-align: center;
    padding: 65px 20px 55px;
    border: 1px solid rgba(201,169,94,.25);
    background: linear-gradient(
        180deg,
        rgba(42,35,23,.55),
        rgba(10,11,15,.8)
    );
    position: relative;
    overflow: hidden;
}

.hero::before {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(226,186,95,.16),
        transparent 70%
    );
    top: -250px;
    left: 50%;
    transform: translateX(-50%);
}

.eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 5px;
    color: #c6a45b;
}

h1 {
    font-size: clamp(32px, 7vw, 55px);
    font-weight: 500;
    letter-spacing: 5px;
    margin: 25px 0 12px;
    color: #f7e6b7;
    text-shadow: 0 0 30px rgba(211,174,91,.25);
}

.subtitle {
    font-family: 'Cinzel', serif;
    letter-spacing: 5px;
    font-size: 14px;
    color: #bba46e;
}

.cover {
    width: 210px;
    height: 210px;
    margin: 35px auto;
    border-radius: 50%;
    border: 1px solid #b99a55;
    padding: 9px;
    box-shadow:
        0 0 35px rgba(205,169,85,.18),
        inset 0 0 30px rgba(205,169,85,.15);
    position: relative;
}

.cover img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

.album-info {
    color: #a99b7d;
    font-size: 12px;
    letter-spacing: 4px;
    margin-top: 20px;
}

.gold-btn {
    border: 1px solid #c5a45f;
    background: linear-gradient(135deg,#c9ad70,#92703b);
    color: #15120b;
    padding: 14px 30px;
    font-size: 13px;
    font-family: inherit;
    letter-spacing: 2px;
    cursor: pointer;
    transition: .3s;
}

.gold-btn:hover {
    box-shadow: 0 0 25px rgba(210,175,91,.4);
    transform: translateY(-2px);
}

.section-title {
    font-family: 'Cinzel', serif;
    color: #c8aa67;
    letter-spacing: 5px;
    font-size: 18px;
    margin: 55px 0 25px;
    text-align: center;
}

.section-subtitle {
    text-align: center;
    font-size: 11px;
    color: #82765e;
    letter-spacing: 3px;
    margin-top: -15px;
}

#tracks {
    margin-top: 30px;
    border-top: 1px solid rgba(196,165,95,.25);
}

.track {
    display: flex;
    align-items: center;
    padding: 17px 12px;
    border-bottom: 1px solid rgba(196,165,95,.13);
    gap: 15px;
    transition: .25s;
}

.track:hover {
    background: rgba(194,158,77,.08);
}

.track.active {
    background: rgba(194,158,77,.13);
    color: #e6c777;
}

.track-number {
    color: #8e7950;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    min-width: 28px;
}

.track-name {
    flex: 1;
    font-size: 13px;
    overflow-wrap: anywhere;
}

.track button {
    background: transparent;
    color: #c9aa66;
    border: 1px solid rgba(201,170,102,.4);
    padding: 7px 13px;
    cursor: pointer;
    font-family: inherit;
}

.track button:hover {
    background: #b99a55;
    color: #111;
}

#status {
    text-align: center;
    color: #b59b61;
    font-size: 12px;
    margin-top: 20px;
}

.search {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    background: #12130f;
    border: 1px solid rgba(196,165,95,.25);
    color: #fff;
    font-family: inherit;
}

.player {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: min(850px, calc(100% - 30px));
    padding: 20px;
    background: rgba(15,15,15,.96);
    border: 1px solid rgba(201,170,102,.4);
    box-shadow: 0 0 40px rgba(0,0,0,.7);
    z-index: 100;
    backdrop-filter: blur(15px);
}

.player-title {
    text-align: center;
    color: #d5b66d;
    font-size: 12px;
    margin-bottom: 15px;
    overflow-wrap: anywhere;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.controls button {
    background: transparent;
    border: none;
    color: #c9ad70;
    font-size: 20px;
    cursor: pointer;
}

.controls .play {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg,#d8bb7b,#99763b);
    color: #111;
    font-size: 20px;
}

.progress {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 10px;
    color: #a99a79;
    margin: 15px 0;
}

input[type=range] {
    accent-color: #c7a45b;
    cursor: pointer;
}

#seek {
    flex: 1;
}

.volume {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    color: #a99a79;
    font-size: 11px;
}

.volume input {
    width: 90px;
}

footer {
    text-align: center;
    color: #756b55;
    font-size: 10px;
    letter-spacing: 3px;
    margin-top: 60px;
}

@media(max-width:600px) {
    main {
        padding: 15px 12px 250px;
    }

    .hero {
        padding: 50px 12px;
    }

    .cover {
        width: 175px;
        height: 175px;
    }

    h1 {
        letter-spacing: 2px;
    }

    .player {
        bottom: 0;
        width: 100%;
        border-radius: 15px 15px 0 0;
        padding: 15px;
    }

    .track {
        padding: 15px 5px;
    }
}
</style>
</head>

<body>

<div class="stars"></div>

<main>

<header class="hero">

<div class="eyebrow">
SPECIAL ORIGINAL SOUNDTRACK
</div>

<div class="cover">
<img
src="https://archive.org/services/img/15-the-god-beyond-god-part-14-forgotten-name"
alt="Album Cover"
>
</div>

<h1>신을 대신한 신</h1>

<div class="subtitle">
THE GOD BEYOND GOD
</div>

<div class="album-info">
22 TRACKS · ORIGINAL SOUNDTRACK
</div>

<br><br>

<button class="gold-btn" onclick="playAll()">
✦ PLAY ENTIRE ALBUM ✦
</button>

<p id="status">천상의 음악을 불러오는 중...</p>

</header>

<h2 class="section-title">THE SACRED MUSIC</h2>

<p class="section-subtitle">
ALBUM TRACK LIST
</p>

<input
class="search"
id="search"
placeholder="수록곡 검색..."
>

<div id="tracks">
</div>

<footer>
THE GOD BEYOND GOD
<br><br>
SPECIAL OST COLLECTION
</footer>

</main>

<audio id="audio" preload="metadata"></audio>

<div class="player">

<div class="player-title" id="current">
음악을 선택해 주세요
</div>

<div class="progress">

<span id="elapsed">0:00</span>

<input
type="range"
id="seek"
min="0"
max="1000"
value="0"
>

<span id="duration">0:00</span>

</div>

<div class="controls">

<button id="shuffle" title="셔플">⤨</button>

<button onclick="previous()">⏮</button>

<button class="play" onclick="togglePlay()" id="playBtn">
▶
</button>

<button onclick="next()">⏭</button>

<button id="repeat" title="반복">↻</button>

</div>

<div class="volume">
<span>VOLUME</span>
<input type="range" id="volume"
min="0" max="1" step="0.01" value="0.8">
</div>

</div>

<script>

const ID =
"15-the-god-beyond-god-part-14-forgotten-name";

const BASE =
"https://archive.org/download/" + ID + "/";

const META =
"https://archive.org/metadata/" + ID;

const audio = document.getElementById("audio");
const list = document.getElementById("tracks");

let songs = [];
let index = -1;
let shuffled = false;
let repeatMode = 0;

function url(name) {
    return BASE + name.split("/")
        .map(encodeURIComponent).join("/");
}

function name(file) {
    return file.split("/").pop()
        .replace(/\.[^.]+$/, "")
        .replace(/[_-]+/g, " ");
}

function time(sec) {
    if (!Number.isFinite(sec)) return "0:00";

    let m = Math.floor(sec / 60);
    let s = Math.floor(sec % 60);

    return m + ":" + String(s).padStart(2,"0");
}

function draw() {

    list.innerHTML = "";

    let query =
        document.getElementById("search").value.toLowerCase();

    songs.forEach((song,i) => {

        let title = name(song.name);

        if (!title.toLowerCase().includes(query)) return;

        let row = document.createElement("div");
        row.className = "track";

        if (i === index) row.classList.add("active");

        let number = document.createElement("div");
        number.className = "track-number";
        number.textContent =
            String(i+1).padStart(2,"0");

        let label = document.createElement("div");
        label.className = "track-name";
        label.textContent = title;

        let button = document.createElement("button");
        button.textContent =
            i === index && !audio.paused ? "재생 중" : "재생";

        button.onclick = () => play(i);

        row.append(number,label,button);

        list.appendChild(row);

    });

}

async function play(i) {

    if (!songs.length) return;

    index = i;

    audio.src = url(songs[i].name);

    document.getElementById("current").textContent =
        name(songs[i].name);

    document.getElementById("status").textContent =
        "NOW PLAYING · " + (i+1) + " / " + songs.length;

    draw();

    try {
        await audio.play();
    } catch(e) {
        document.getElementById("status").textContent =
            "재생에 실패했습니다. 다시 시도해 주세요.";
    }

}

function playAll() {

    if (!songs.length) return;

    play(0);

}

function togglePlay() {

    if (index === -1) {
        playAll();
        return;
    }

    if (audio.paused) {
        audio.play().catch(() => {});
    } else {
        audio.pause();
    }

}

function next() {

    if (!songs.length) return;

    if (shuffled && songs.length > 1) {

        let nextIndex;

        do {
            nextIndex =
                Math.floor(Math.random()*songs.length);
        } while(nextIndex === index);

        play(nextIndex);

    } else if (index < songs.length-1) {

        play(index+1);

    } else if (repeatMode === 1) {

        play(0);

    }

}

function previous() {

    if (!songs.length) return;

    if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
    }

    play(Math.max(0,index-1));

}

audio.addEventListener("ended", () => {

    if (repeatMode === 2) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
    } else {
        next();
    }

});

audio.addEventListener("play", () => {

    document.getElementById("playBtn").textContent = "Ⅱ";

    draw();

});

audio.addEventListener("pause", () => {

    document.getElementById("playBtn").textContent = "▶";

    draw();

});

audio.addEventListener("timeupdate", () => {

    if (!audio.duration) return;

    document.getElementById("seek").value =
        audio.currentTime / audio.duration * 1000;

    document.getElementById("elapsed").textContent =
        time(audio.currentTime);

    document.getElementById("duration").textContent =
        time(audio.duration);

});

document.getElementById("seek").addEventListener(
    "input", e => {

        if (audio.duration) {
            audio.currentTime =
                e.target.value / 1000 * audio.duration;
        }

    }
);

document.getElementById("volume").addEventListener(
    "input", e => {
        audio.volume = Number(e.target.value);
    }
);

audio.volume = 0.8;

document.getElementById("shuffle").onclick = function() {

    shuffled = !shuffled;

    this.style.color =
        shuffled ? "#fff0b0" : "#c9ad70";

};

document.getElementById("repeat").onclick = function() {

    repeatMode = (repeatMode+1)%3;

    this.textContent =
        repeatMode === 0 ? "↻" :
        repeatMode === 1 ? "↻" : "↻¹";

    this.style.color =
        repeatMode ? "#fff0b0" : "#c9ad70";

};

document.getElementById("search").addEventListener(
    "input", draw
);

async function init() {

    try {

        const response = await fetch(META);

        if (!response.ok) throw new Error("API error");

        const data = await response.json();

        songs = (data.files || [])
            .filter(file =>
                file.name &&
                /\.(mp3|m4a|aac|ogg|oga|wav|flac)$/i
                    .test(file.name) &&
                !file.name.startsWith("__")
            )
            .sort((a,b) =>
                a.name.localeCompare(
                    b.name,
                    undefined,
                    {numeric:true,sensitivity:"base"}
                )
            );

        if (!songs.length) {
            throw new Error("No tracks");
        }

        draw();

        document.getElementById("status").textContent =
            "총 " + songs.length + "곡의 음악이 준비되었습니다.";

    } catch(e) {

        document.getElementById("status").textContent =
            "음원 연결에 실패했습니다. 잠시 후 새로고침해 주세요.";

        list.textContent =
            "앨범 음원 목록을 불러오지 못했습니다.";

    }

}

init();

</script>

</body>
</html>
