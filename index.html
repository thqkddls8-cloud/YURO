<style>

/* =========================
   GLOBAL
========================= */

* {
    box-sizing: border-box;
}

:root {
    --gold: #d8b66c;
    --gold-light: #f4dfaa;
    --gold-dark: #80602d;
    --dark: #080a12;
    --text: #f7edd4;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--dark);
    color: var(--text);
    font-family: 'Noto Serif KR', serif;
    overflow-x: hidden;
}

button {
    font-family: inherit;
}

button,
input {
    -webkit-tap-highlight-color: transparent;
}

/* =========================
   COSMIC BACKGROUND
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -3;

    background:
    radial-gradient(
        ellipse at 50% 20%,
        rgba(190,148,66,.17),
        transparent 55%
    ),
    linear-gradient(
        180deg,
        #111523,
        #090b13 65%,
        #05060b
    );
}

.stars {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;

    background-image:
    radial-gradient(1px 1px at 10% 20%, #fff, transparent),
    radial-gradient(2px 2px at 30% 50%, #e8d19b, transparent),
    radial-gradient(1px 1px at 70% 30%, #fff, transparent),
    radial-gradient(2px 2px at 85% 70%, #d8b66c, transparent),
    radial-gradient(1px 1px at 45% 80%, #fff, transparent);

    background-size: 280px 280px;

    animation: starMove 30s linear infinite;
}

@keyframes starMove {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-280px);
    }
}

/* =========================
   HERO
========================= */

.hero {
    position: relative;
    min-height: 850px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    overflow: hidden;

    background:

        180deg,
        rgba(5,7,15,.05),
        rgba(5,7,15,.3) 55%,
        #090b13 100%

}

/* Fantasy temple illustration */

.hero-art {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.hero-art svg {
    width: 100%;
    height: 100%;

}

.hero-art::after {

    position: absolute;
    inset: 0;

.eyebrow {

.track-total {

.track button:hover {

/* =========================

========================= */

input[type=range] {

#seek {

.controls {

.controls button {

.controls .play-button {

    .controls {

    }

        padding-top: 55px;
    }

}

</style>
</head>

<script>

/* =========================
   INTERNET ARCHIVE
========================= */

const ID =
"15-the-god-beyond-god-part-14-forgotten-name";

const BASE =
"https://archive.org/download/" + ID + "/";

const META =
"https://archive.org/metadata/" + ID;

const audio =
document.getElementById("audio");

const list =
document.getElementById("tracks");

const status =
document.getElementById("status");

let songs = [];
let index = -1;

let shuffled = false;
let repeatMode = 0;

let isSeeking = false;


/* =========================
   UTILITIES
========================= */

function makeURL(filename) {

    return BASE + filename
        .split("/")
        .map(encodeURIComponent)
        .join("/");

}

function getName(filename) {

    return filename
        .split("/")
        .pop()
        .replace(/\.[^.]+$/, "")
        .replace(/[_-]+/g, " ");

}

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) return "0:00";

    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);

    return m + ":" + String(s).padStart(2,"0");

}


/* =========================
   TRACK DISPLAY
========================= */

function drawTracks() {

    list.innerHTML = "";

    const query =
        document.getElementById("search")
        .value.toLowerCase();

    songs.forEach((song,i) => {

        const title = getName(song.name);

        if (!title.toLowerCase().includes(query)) {
            return;
        }

        const row = document.createElement("div");

        row.className = "track";

        if (i === index) {
            row.classList.add("active");
        }

        const number = document.createElement("div");

        number.className = "track-number";

        number.textContent =
            String(i+1).padStart(2,"0");

        const name = document.createElement("div");

        name.className = "track-name";

        name.textContent = title;

        const duration = document.createElement("div");

        duration.className = "track-duration";

        duration.textContent =
            formatTime(Number(song.length));

        const button = document.createElement("button");

        button.textContent =
            i === index && !audio.paused
            ? "재생 중"
            : "재생";

        button.onclick = () => play(i);

        row.append(
            number,
            name,
            duration,
            button
        );

        list.appendChild(row);

    });

}


/* =========================
   PLAY MUSIC
========================= */

async function play(i) {

    if (!songs.length) return;

    index = i;

    audio.src = makeURL(songs[i].name);

    document.getElementById("current")
        .textContent = getName(songs[i].name);

    status.textContent =
        "NOW PLAYING · " +
        (index+1) + " / " + songs.length;

    drawTracks();

    try {

        await audio.play();

    } catch(e) {

        status.textContent =
            "재생할 수 없습니다. 다시 시도해 주세요.";

    }

}


/* =========================
   PLAY ALL
========================= */

function playAll() {

    if (!songs.length) return;

    play(0);

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay() {

    if (index === -1) {

        playAll();

        return;

    }

    if (audio.paused) {

        audio.play().catch(() => {});

    } else {

        audio.pause();

    }

}


/* =========================
   NEXT
========================= */

function next() {

    if (!songs.length) return;

    if (shuffled && songs.length > 1) {

        let random;

        do {

            random = Math.floor(
                Math.random() * songs.length
            );

        } while(random === index);

        play(random);

        return;

    }

    if (index < songs.length-1) {

        play(index+1);

    } else if (repeatMode === 1) {

        play(0);

    } else {

        audio.pause();

        status.textContent =
            "앨범 재생이 끝났습니다.";

    }

}


/* =========================
   PREVIOUS
========================= */

function previous() {

    if (!songs.length) return;

    if (audio.currentTime > 3) {

        audio.currentTime = 0;

        return;

    }

    if (index > 0) {

        play(index-1);

    } else if (repeatMode === 1) {

        play(songs.length-1);

    }

}


/* =========================
   AUDIO EVENTS
========================= */

audio.addEventListener("play", () => {

    document.getElementById("playBtn")
        .textContent = "Ⅱ";

    drawTracks();

});

audio.addEventListener("pause", () => {

    document.getElementById("playBtn")
        .textContent = "▶";

    drawTracks();

});

audio.addEventListener("timeupdate", () => {

    if (!audio.duration || isSeeking) return;

    document.getElementById("seek").value =
        audio.currentTime / audio.duration * 1000;

    document.getElementById("elapsed").textContent =
        formatTime(audio.currentTime);

    document.getElementById("duration").textContent =
        formatTime(audio.duration);

});

audio.addEventListener("loadedmetadata", () => {

    document.getElementById("duration").textContent =
        formatTime(audio.duration);

});

audio.addEventListener("ended", () => {

    if (repeatMode === 2) {

        audio.currentTime = 0;

        audio.play().catch(() => {});

    } else {

        next();

    }

});

audio.addEventListener("error", () => {

    status.textContent =
        "음원 재생 오류가 발생했습니다.";

});


/* =========================
   SEEK
========================= */

const seek =
    document.getElementById("seek");

seek.addEventListener("input", () => {

    isSeeking = true;

});

seek.addEventListener("change", () => {

    if (audio.duration) {

        audio.currentTime =
            seek.value / 1000 * audio.duration;

    }

    isSeeking = false;

});


/* =========================
   VOLUME
========================= */

document.getElementById("volume")
.addEventListener("input", e => {

    audio.volume = Number(e.target.value);

});

audio.volume = 0.8;


/* =========================
   SHUFFLE
========================= */

document.getElementById("shuffle")
.onclick = function() {

    shuffled = !shuffled;

    this.classList.toggle("active",shuffled);

};


/* =========================
   REPEAT
========================= */

document.getElementById("repeat")
.onclick = function() {

    repeatMode = (repeatMode+1)%3;

    this.textContent =
        repeatMode === 0 ? "↻" :
        repeatMode === 1 ? "↻" :
        "↻¹";

    this.classList.toggle(
        "active",
        repeatMode !== 0
    );

};


/* =========================
   SEARCH
========================= */

document.getElementById("search")
.addEventListener("input",drawTracks);


/* =========================
   LOAD ALBUM
========================= */

async function init() {

    try {

        const response = await fetch(META);

        if (!response.ok) {
            throw new Error("Metadata error");
        }

        const data = await response.json();

        songs = (data.files || [])

            .filter(file =>
                file.name &&
                /\.(mp3|m4a|aac|ogg|oga|wav|flac)$/i
                .test(file.name) &&
                !file.name.startsWith("__")
            )

            .sort((a,b) =>
                a.name.localeCompare(
                    b.name,
                    undefined,
                    {
                        numeric:true,
                        sensitivity:"base"
                    }
                )
            );

        if (!songs.length) {

            throw new Error("No audio files");

        }

        document.querySelector(".track-total")
            .textContent =
            "✦ " + songs.length + " TRACKS ✦";

        drawTracks();

        status.textContent =
            "총 " + songs.length +
            "곡의 음악이 준비되었습니다.";

    } catch(error) {

        status.textContent =
            "앨범 음원을 불러오지 못했습니다.";

        list.textContent =
            "Internet Archive 연결을 확인해 주세요.";

    }

}

init();

</script>
