<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b13">

<title>신을 대신한 신 | THE GOD BEYOND GOD</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   GLOBAL
========================= */

* {
    box-sizing: border-box;
}

:root {
    --gold: #d8b66c;
    --gold-light: #f4dfaa;
    --gold-dark: #80602d;
    --dark: #080a12;
    --text: #f7edd4;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--dark);
    color: var(--text);
    font-family: 'Noto Serif KR', serif;
    overflow-x: hidden;
}

button {
    font-family: inherit;
}

button,
input {
    -webkit-tap-highlight-color: transparent;
}

/* =========================
   COSMIC BACKGROUND
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -3;

    background:
    radial-gradient(
        ellipse at 50% 20%,
        rgba(190,148,66,.17),
        transparent 55%
    ),
    linear-gradient(
        180deg,
        #111523,
        #090b13 65%,
        #05060b
    );
}

.stars {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;

    background-image:
    radial-gradient(1px 1px at 10% 20%, #fff, transparent),
    radial-gradient(2px 2px at 30% 50%, #e8d19b, transparent),
    radial-gradient(1px 1px at 70% 30%, #fff, transparent),
    radial-gradient(2px 2px at 85% 70%, #d8b66c, transparent),
    radial-gradient(1px 1px at 45% 80%, #fff, transparent);

    background-size: 280px 280px;

    animation: starMove 30s linear infinite;
}

@keyframes starMove {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-280px);
    }
}

/* =========================
   HERO
========================= */

.hero {
    position: relative;
    min-height: 850px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    overflow: hidden;

    background:
    linear-gradient(
        180deg,
        rgba(5,7,15,.05),
        rgba(5,7,15,.3) 55%,
        #090b13 100%
    );
}

/* Fantasy temple illustration */

.hero-art {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.hero-art svg {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.hero-art::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
    linear-gradient(
        180deg,
        rgba(5,7,15,.1),
        rgba(5,7,15,.15) 40%,
        #090b13 100%
    );
}

.hero-content {
    position: relative;
    z-index: 2;

    width: 100%;
    padding: 100px 20px 120px;
}

.eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 7px;

    color: var(--gold);
    text-shadow: 0 0 20px rgba(230,190,100,.5);
}

.hero h1 {
    margin: 32px 0 12px;

    font-size: clamp(36px, 7vw, 76px);
    font-weight: 500;

    letter-spacing: 7px;

    color: #fff0ca;

    text-shadow:
    0 0 15px rgba(255,220,150,.35),
    0 0 50px rgba(218,174,87,.3);
}

.english-title {
    font-family: 'Cinzel', serif;

    font-size: clamp(15px, 3vw, 23px);

    letter-spacing: 8px;

    color: var(--gold-light);
}

.creator-credit {
    margin-top: 23px;

    font-size: 13px;
    letter-spacing: 2px;

    color: #e2c990;

    text-shadow: 0 0 15px rgba(218,174,87,.4);
}

.divider {
    width: 120px;
    height: 1px;

    margin: 30px auto;

    background:
    linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );
}

.album-label {
    font-family: 'Cinzel', serif;

    font-size: 11px;
    letter-spacing: 5px;

    color: #c9b27c;
}

.track-total {
    margin-top: 12px;

    font-family: 'Cinzel', serif;

    font-size: 12px;
    letter-spacing: 4px;

    color: #e7d7ad;
}

/* =========================
   BUTTONS
========================= */

.main-buttons {
    margin-top: 42px;

    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.gold-button {
    padding: 15px 32px;

    border: 1px solid #e2c47d;

    background:
    linear-gradient(
        135deg,
        #e8ce91,
        #a77b35
    );

    color: #17120a;

    font-size: 12px;
    letter-spacing: 3px;

    cursor: pointer;

    transition: .3s;
}

.gold-button:hover {
    transform: translateY(-3px);

    box-shadow:
    0 0 20px rgba(224,185,100,.45);
}

.outline-button {
    padding: 15px 28px;

    border: 1px solid rgba(220,190,120,.6);

    background: rgba(10,12,20,.5);

    color: #e8d6a7;

    font-size: 12px;
    letter-spacing: 2px;

    cursor: pointer;
}

.outline-button:hover {
    background: rgba(210,170,90,.15);
}

/* =========================
   ALBUM CONTENT
========================= */

main {
    width: min(900px, 92%);
    margin: auto;
}

.album-section {
    padding: 75px 0 200px;
}

.section-heading {
    text-align: center;
    margin-bottom: 35px;
}

.section-heading h2 {
    font-family: 'Cinzel', serif;

    font-size: 23px;
    font-weight: 400;
