<style>

/* =================================
   BASIC
================================= */

* {
    box-sizing: border-box;
}

:root {
    --gold: #d8b66c;

    --dark: #080a12;

/* =================================
   COSMIC BACKGROUND
================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -3;

    background:
    radial-gradient(
        ellipse at 50% 20%,
        rgba(190,148,66,.17),
        transparent 55%
    ),
    linear-gradient(
        180deg,
        #141b30,
        #090b13 65%,
        #05060b
    );

.stars {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;

    radial-gradient(1px 1px at 10% 20%, #fff, transparent),
    radial-gradient(2px 2px at 30% 50%, #e8d19b, transparent),
    radial-gradient(1px 1px at 70% 30%, #fff, transparent),
    radial-gradient(2px 2px at 85% 70%, #d8b66c, transparent),
    radial-gradient(1px 1px at 45% 80%, #fff, transparent);

    background-size: 280px 280px;

    animation: starMove 30s linear infinite;
}

@keyframes starMove {
    from { transform: translateY(0); }

}

<script>

/* =================================
   INTERNET ARCHIVE
================================= */

const ID =
"15-the-god-beyond-god-part-14-forgotten-name";

const BASE =
"https://archive.org/download/" + ID + "/";

const META =
"https://archive.org/metadata/" + ID;


const audio =
document.getElementById("audio");

const list =
document.getElementById("tracks");

const status =
document.getElementById("status");


let songs = [];

let index = -1;

let shuffled = false;

/*
0 = 반복 없음
1 = 전체 앨범 반복
2 = 한 곡 반복
*/

let repeatMode = 0;

let isSeeking = false;


/* =================================
   UTILITIES
================================= */

function makeURL(filename) {

    return BASE + filename
        .split("/")
        .map(encodeURIComponent)
        .join("/");

}


function getName(filename) {

    return filename
        .split("/")
        .pop()
        .replace(/\.[^.]+$/, "")
        .replace(/[_-]+/g, " ");

}


function formatTime(seconds) {

    if (!Number.isFinite(seconds)) return "0:00";

    const m = Math.floor(seconds / 60);

    const s = Math.floor(seconds % 60);

    return m + ":" + String(s).padStart(2,"0");

}


/* =================================
   DRAW TRACKS
================================= */

function drawTracks() {

    list.innerHTML = "";

    const query =
        document.getElementById("search")
        .value.toLowerCase();

    songs.forEach((song,i) => {

        const title = getName(song.name);

        if (!title.toLowerCase().includes(query)) {
            return;
        }

        const row = document.createElement("div");

        row.className = "track";

        if (i === index) {
            row.classList.add("active");
        }

        const number = document.createElement("div");

        number.className = "track-number";

        number.textContent =
            String(i+1).padStart(2,"0");

        const name = document.createElement("div");

        name.className = "track-name";

        name.textContent = title;

        const duration = document.createElement("div");

        duration.className = "track-duration";

        duration.textContent =
            formatTime(Number(song.length));

        const button = document.createElement("button");

        button.textContent =
            i === index && !audio.paused
            ? "재생 중"
            : "재생";

        button.onclick = () => play(i);

        row.append(
            number,
            name,
            duration,
            button
        );

        list.appendChild(row);

    });

}


/* =================================
   PLAY MUSIC
================================= */

async function play(i) {

    if (!songs.length) return;

    if (i < 0 || i >= songs.length) return;

    index = i;

    audio.pause();

    audio.src = makeURL(songs[i].name);

    audio.load();

    document.getElementById("current")
        .textContent = getName(songs[i].name);

    status.textContent =
        "NOW PLAYING · " +
        (index+1) + " / " + songs.length;

    drawTracks();

    document.getElementById("seek").value = 0;

    document.getElementById("elapsed").textContent = "0:00";

    document.getElementById("duration").textContent = "0:00";

    try {

        await audio.play();

    } catch(error) {

        console.error(error);

        status.textContent =
            "재생할 수 없습니다. 다시 시도해 주세요.";

    }

}


/* =================================
   PLAY ALL
================================= */

function playAll() {

    if (!songs.length) return;

    play(0);

}


/* =================================
   PLAY / PAUSE
================================= */

function togglePlay() {

    if (index === -1) {

        playAll();

        return;

    }

    if (audio.paused) {

        audio.play().catch(error => {
            console.error(error);
        });

    } else {

        audio.pause();

    }

}


/* =================================
   NEXT TRACK
================================= */

async function next() {

    if (!songs.length) return;

    if (index === -1) {
        await play(0);
        return;
    }

    let nextIndex;

    if (shuffled && songs.length > 1) {

        do {

            nextIndex = Math.floor(
                Math.random() * songs.length
            );

        } while(nextIndex === index);

    }

    else if (index < songs.length - 1) {

        nextIndex = index + 1;

    }

    else if (repeatMode === 1) {

        nextIndex = 0;

    }

    else {

        audio.pause();

        status.textContent =
            "앨범의 모든 음악을 감상했습니다.";

        document.getElementById("current")
            .textContent = "THE END";

        return;

    }

    await play(nextIndex);

}


/* =================================
   PREVIOUS TRACK
================================= */

async function previous() {

    if (!songs.length || index === -1) return;

    if (audio.currentTime > 3) {

        audio.currentTime = 0;

        return;

    }

    if (index > 0) {

        await play(index-1);

    }

    else if (repeatMode === 1) {

        await play(songs.length-1);

    }

}


/* =================================
   AUTOMATIC NEXT
================================= */

audio.addEventListener("ended", async function() {

    console.log("곡 종료 - 다음 곡 자동 재생");

    if (repeatMode === 2) {

        audio.currentTime = 0;

        try {

            await audio.play();

        } catch(error) {

            console.error(error);

        }

        return;

    }

    await next();

});


/* =================================
   AUDIO EVENTS
================================= */

audio.addEventListener("play", function() {

    document.getElementById("playBtn")
        .textContent = "Ⅱ";

    drawTracks();

});


audio.addEventListener("pause", function() {

    document.getElementById("playBtn")
        .textContent = "▶";

    drawTracks();

});


audio.addEventListener("timeupdate", function() {

    if (!audio.duration || isSeeking) return;

    document.getElementById("seek").value =
        audio.currentTime / audio.duration * 1000;

    document.getElementById("elapsed").textContent =
        formatTime(audio.currentTime);

    document.getElementById("duration").textContent =
        formatTime(audio.duration);

});


audio.addEventListener("loadedmetadata", function() {

    document.getElementById("duration").textContent =
        formatTime(audio.duration);

});


audio.addEventListener("error", function() {

    if (!audio.src) return;

    status.textContent =
        "음원 파일을 불러오지 못했습니다.";

});


/* =================================
   SEEK
================================= */

const seek =
    document.getElementById("seek");


seek.addEventListener("input", function() {

    isSeeking = true;

});


seek.addEventListener("change", function() {

    if (audio.duration) {

        audio.currentTime =
            seek.value / 1000 * audio.duration;

    }

    isSeeking = false;

});


/* =================================
   VOLUME
================================= */

document.getElementById("volume")
.addEventListener("input", function(e) {

    audio.volume = Number(e.target.value);

});

audio.volume = 0.8;


/* =================================
   SHUFFLE
================================= */

document.getElementById("shuffle")
.onclick = function() {

    shuffled = !shuffled;

    this.classList.toggle("active",shuffled);

    status.textContent = shuffled
        ? "셔플 재생 활성화"
        : "일반 순서 재생";

};


/* =================================
   REPEAT
================================= */

document.getElementById("repeat")
.onclick = function() {

    repeatMode = (repeatMode+1)%3;

    this.classList.toggle(
        "active",
        repeatMode !== 0
    );

    if (repeatMode === 0) {

        this.textContent = "↻";

        status.textContent = "반복 재생 꺼짐";

    }

    else if (repeatMode === 1) {

        this.textContent = "↻";

        status.textContent = "전체 앨범 반복";

    }

    else {

        this.textContent = "↻¹";

        status.textContent = "현재 곡 반복";

    }

};


/* =================================
   SEARCH
================================= */

document.getElementById("search")
.addEventListener("input",drawTracks);


/* =================================
   LOAD ALBUM
================================= */

async function init() {

    try {

        const response = await fetch(META);

        if (!response.ok) {

            throw new Error("Metadata error");

        }

        const data = await response.json();

        songs = (data.files || [])

            .filter(file =>

                file.name &&

                /\.(mp3|m4a|aac|ogg|oga|wav|flac)$/i
                .test(file.name) &&

                !file.name.startsWith("__")

            )

            .sort((a,b) =>

                a.name.localeCompare(

                    b.name,

                    undefined,

                    {
                        numeric:true,
                        sensitivity:"base"
                    }

                )

            );


        if (!songs.length) {

            throw new Error("No audio files");

        }


        document.querySelector(".track-total")
            .textContent =
            "✦ " + songs.length + " TRACKS ✦";


        drawTracks();


        status.textContent =
            "총 " + songs.length +
            "곡의 음악이 준비되었습니다.";


    }

    catch(error) {

        console.error(error);

        status.textContent =
            "앨범 음원을 불러오지 못했습니다.";

        list.textContent =
            "Internet Archive 연결을 확인해 주세요.";

    }

}


/* =================================
   START
================================= */

init();

</script>
